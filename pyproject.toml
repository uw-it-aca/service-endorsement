[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ServiceEndorsement"
dynamic = ["version"]
description = "App managing University of Washington Endorsed Services"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache License, Version 2.0"}
authors = [
    {name = "UW-IT AXDD", email = "aca-it@uw.edu"},
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "django~=5.2",
    "djangorestframework==3.17.2",
    "ordereddict",
    "simplejson",
    "django-webpack-loader==3.2.4",
    "django-userservice~=3.2",
    "urllib3~=1.26",
    "psycopg[c]",
    "uw-memcached-clients~=1.1",
    "uw-restclients-core~=1.4",
    "uw-restclients-pws==2.1",
    "uw-restclients-gws~=2.3",
    "uw-restclients-uwnetid~=1.1",
    "uw-restclients-django-utils~=2.3",
    "uw-restclients-itbill~=0.1",
    "uw-restclients-msca~=0.2",
    "django-safe-emailbackend~=1.2",
    "uw-django-saml2~=1.8",
    "django-pyscss",
    "django-supporttools~=3.5",
    "django-persistent-message~=1.3",
    "django_client_logger~=3.1",
]

[project.urls]
Homepage = "https://github.com/uw-it-aca/service-endorsement"
Repository = "https://github.com/uw-it-aca/service-endorsement"

[tool.setuptools]
packages = ["endorsement"]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "endorsement/VERSION"}

[tool.ruff]
line-length = 100

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
ignore = [
    "BLE001",
    "PLW0602",
    "RUF012",
    "SIM102",
    "TRY002",
]
exclude = [
    "*/migrations/*",
]
